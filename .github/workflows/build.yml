name: Compilar APK de ChromaCraft Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug con Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: ChromaCraftStudio-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
